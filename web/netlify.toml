# Netlify configuration for Code Wiki Web Interface

[build]
  # Build command — overlay private content (if configured), then compile functions.
  # Index building is handled by GitHub Actions (.github/workflows/update-index.yml)
  # which commits to the private content repo. The overlay script clones it at build time.
  command = "bash scripts/netlify-build.sh"
  # Directory containing the static files
  publish = "public"
  # Directory containing Netlify Functions
  functions = "netlify/functions-dist"

[build.environment]
  # Node version
  NODE_VERSION = "20"

# Environment variables are set in Netlify dashboard, not here
# Note: GITHUB_TOKEN is NOT needed for Netlify builds anymore
# Index generation happens via GitHub Actions which has built-in GITHUB_TOKEN
# Optional env vars:
# - NETLIFY_BUILD_HOOK: If set in GitHub repo secrets, allows Actions to trigger rebuilds

# Development settings
[dev]
  command = "npm run build:index"
  publish = "public"
  functions = "netlify/functions-dist"
  port = 8888
  autoLaunch = false

# Headers for CORS and security
[[headers]]
  for = "/api/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Authorization"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Bundle private-data/ with every function so server-side code can read
# index-full.json and other sensitive overlay files via the filesystem.
# This directory lives outside public/ and is never served as a CDN asset.
[functions]
  included_files = ["private-data/**", "public/data/**"]

# Redirects for SPA routing and API
# API routes go to Netlify functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

# Defense-in-depth: explicitly block any *-full.json under /data/ from being
# served as a static asset, in case the build script ever fails to scrub them.
# These files contain private repo metadata and must only be read server-side.
[[redirects]]
  from = "/data/*-full.json"
  to = "/404.html"
  status = 404
  force = true

# SPA fallback - serve index.html for all routes (except static files)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
