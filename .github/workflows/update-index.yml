name: Update Wiki Index

on:
  # Run daily at midnight UTC
  schedule:
    - cron: '0 0 * * *'

  # Allow manual trigger from Actions tab
  workflow_dispatch:
    inputs:
      dependency_scan:
        description: 'Run the dependency update and vulnerability scan now instead of waiting for its weekly turn'
        type: boolean
        default: false

  # Run when wiki content changes
  push:
    paths:
      - 'wiki/**'

jobs:
  update-index:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout public repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Clone private content repo and overlay wiki
        # Cloning + overlay must run BEFORE build:index so the index reflects
        # both public source content and private overlay content (e.g.
        # wiki/projects/repo-locations.md, wiki/personal/*, taxonomy
        # examples). Files marked `visibility: private` are filtered out of
        # public/data/index.json by the builder; full content is preserved
        # in private-data/index-full.json (auth-gated by full-index.ts).
        env:
          PRIVATE_CONTENT_TOKEN: ${{ secrets.PRIVATE_CONTENT_WRITE_TOKEN }}
          PRIVATE_CONTENT_REPO: ${{ vars.PRIVATE_CONTENT_REPO || 'mindfu23/code-wiki-content' }}
        run: |
          git clone --depth 1 \
            "https://x-access-token:${PRIVATE_CONTENT_TOKEN}@github.com/${PRIVATE_CONTENT_REPO}.git" \
            /tmp/private-content
          if [ -d /tmp/private-content/wiki ]; then
            cp -rT /tmp/private-content/wiki wiki
            echo "Overlaid private wiki content"
          else
            echo "No wiki/ in private content repo — skipping overlay"
          fi

      - name: Build index with GitHub API
        working-directory: web
        env:
          USE_GITHUB_API: 'true'
          GITHUB_TOKEN: ${{ secrets.REPO_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
          WIKI_DIR: ${{ github.workspace }}/wiki
          # The overlay above merged private pages into wiki/. This tells the builder which
          # ones came from the private repo, so they default to private (fail closed).
          PRIVATE_WIKI_DIR: /tmp/private-content/wiki
        run: npm run build:index

      - name: Check diagram staleness
        working-directory: web
        env:
          GITHUB_TOKEN: ${{ secrets.REPO_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: npm run build:signals

      - name: Build taxonomy
        working-directory: web
        run: npm run build:taxonomy

      - name: Leak gate — public outputs must not reference private content
        # Fails the run (before anything is copied or committed) if index.json,
        # category-*.json, taxonomy.json or diagram-signals.json names a private
        # repo, a private doc path or body, or a home-directory path. Prints
        # per-file counts only; run it locally without CI=1 to see the matches.
        working-directory: web
        run: npm run check:public-outputs

      - name: Build repo-locations.md
        # Regenerates wiki/projects/repo-locations.md directly from GitHub
        # so it stays fresh nightly without needing the MCP server locally.
        # Local filesystem paths are absent in the CI output; `sync_repos`
        # enriches them on a developer's machine after a clone.
        working-directory: web
        env:
          GITHUB_TOKEN: ${{ secrets.REPO_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: |
          mkdir -p /tmp/private-content/wiki/projects
          npm run build:repo-locations -- --out /tmp/private-content/wiki/projects/repo-locations.md

      - name: Build dependency report
        # Reads each active repo's dependency manifests and lockfiles (npm,
        # Flutter/Dart, Python, Go, Rust) for stack tags, direct dependencies
        # with declared and installed versions, and open Dependabot PRs. It
        # also shallow-clones each repo into a temp dir (deleted after) to
        # find external APIs, including ones called over plain HTTP, and the
        # AI model IDs written in code.
        # Roughly weekly (or when dispatched with dependency_scan) it also
        # looks up every direct dependency's latest release and checks every
        # locked package against OSV advisories, caching the results in the
        # private content repo at data/dependency-scan.json (outside
        # web/public/data, so Netlify never serves it). It also writes
        # data/models.json, the model ids found in code (no repo names), which
        # Watchtower reads to check each one is still served. The report itself
        # goes to /tmp for the digest step and isn't committed.
        # A failure here never blocks the status digest: pages are then
        # written without a Dependencies section.
        continue-on-error: true
        working-directory: web
        env:
          GITHUB_TOKEN: ${{ secrets.REPO_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
          SCAN_MODE: ${{ inputs.dependency_scan && 'always' || 'auto' }}
        run: |
          npm run build:deps -- \
            --out /tmp/dependency-report.json \
            --cache /tmp/private-content/data/dependency-scan.json \
            --models-out /tmp/private-content/data/models.json \
            --scan "$SCAN_MODE"

      - name: Build per-app status digest
        # Copies each active repo's TODO / HANDOFF / NEXT / ROADMAP / STATUS
        # notes, last 5 commit messages and open issue count into
        # wiki/status/<repo>.md, plus wiki/status/overview.md. Pages are
        # marked visibility: private so they stay out of the public index.
        # The next night's overlay pulls them into the searchable index.
        # With --deps each page also gets a Dependencies section,
        # wiki/status/stack.md lists every app's languages, frameworks, APIs
        # and AI models, and wiki/status/dependencies.md ranks apps by
        # vulnerabilities and outdated dependencies (skipped if the report
        # step failed).
        working-directory: web
        env:
          GITHUB_TOKEN: ${{ secrets.REPO_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: npm run build:status-digest -- --out /tmp/private-content/wiki/status --deps /tmp/dependency-report.json

      - name: Copy generated files to private content repo
        run: |
          # Copy index and category files
          cp web/public/data/index.json /tmp/private-content/web/public/data/
          cp web/public/data/index-full.json /tmp/private-content/web/public/data/
          cp web/public/data/category-*.json /tmp/private-content/web/public/data/
          cp web/public/data/diagram-signals.json /tmp/private-content/web/public/data/
          # Taxonomy outputs
          cp web/public/data/taxonomy.json /tmp/private-content/web/public/data/ 2>/dev/null || true
          cp web/public/data/taxonomy-full.json /tmp/private-content/web/public/data/ 2>/dev/null || true

      - name: Commit and push to private content repo
        working-directory: /tmp/private-content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Include wiki/projects/ so the regenerated repo-locations.md is committed,
          # and wiki/status/ for the per-app status digest (-A picks up removals)
          git add web/public/data/ wiki/projects/
          git add -A wiki/status/
          # Weekly dependency scan cache (only changes when a scan ran)
          if [ -d data ]; then git add -A data/; fi
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            # -q: a plain commit prints "create mode ... wiki/status/<repo>.md" for each new
            # page, i.e. private repo names, and this repo's Actions logs are public.
            # Print a count instead.
            echo "Committing $(git diff --cached --name-only | wc -l) changed file(s)"
            git commit -q -m "chore: update wiki index $(date -u +%Y-%m-%d)"
            git push -q
          fi

      - name: Trigger Netlify rebuild
        if: env.NETLIFY_BUILD_HOOK != ''
        env:
          NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          curl -X POST -d '{}' "$NETLIFY_BUILD_HOOK"
