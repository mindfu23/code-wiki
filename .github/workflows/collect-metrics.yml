name: Collect Observatory Metrics

on:
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours
  workflow_dispatch:        # Manual trigger

jobs:
  collect-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mcp-server/package-lock.json

      - name: Install MCP server dependencies
        working-directory: mcp-server
        run: npm ci

      - name: Build MCP server
        working-directory: mcp-server
        run: npm run build

      - name: Collect metrics
        working-directory: mcp-server
        env:
          GH_API_TOKEN: ${{ secrets.REPO_ACCESS_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
          SOURCE_DIRS: /tmp/dummy
          WIKI_DIR: /tmp/dummy
          NETLIFY_ACCESS_TOKEN: ${{ secrets.NETLIFY_ACCESS_TOKEN }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          GCP_SERVICE_ACCOUNT_KEY_PATH: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY_PATH }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REFS: ${{ secrets.SUPABASE_PROJECT_REFS }}
          N8N_API_URL: ${{ secrets.N8N_API_URL }}
          N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
        run: node dist/scripts/collectMetrics.js

      - name: Clone private content repo
        run: |
          git clone --depth 1 \
            "https://x-access-token:${{ secrets.PRIVATE_CONTENT_WRITE_TOKEN }}@github.com/${{ vars.PRIVATE_CONTENT_REPO || 'mindfu23/code-wiki-content' }}.git" \
            /tmp/private-content

      - name: Copy metrics to private content repo
        run: |
          mkdir -p /tmp/private-content/web/public/data/metrics
          cp web/public/data/metrics/*.json /tmp/private-content/web/public/data/metrics/

      - name: Commit and push to private content repo
        working-directory: /tmp/private-content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/public/data/metrics/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: collect observatory metrics $(date -u +%Y-%m-%d)"
            git push
          fi
